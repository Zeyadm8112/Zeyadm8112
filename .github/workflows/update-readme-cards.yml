name: Update README Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=github_dark&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=github_dark&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          - name: Real Estate PySpark Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Real-Estate-Pyspark
          path: profile/real-estate-pyspark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Football Stats ETL Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Football-stats-ETL
          path: profile/football-stats-etl.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activator Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Activator
          path: profile/activator.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aloy Backend Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=aloy-backend
          path: profile/aloy-backend.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aloy Frontend Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=aloy-frontend
          path: profile/aloy-frontend.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aloy RAG Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=aloy_rag
          path: profile/aloy-rag.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
